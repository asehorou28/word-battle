<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WORD BATTLE</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      margin: 0;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1f2937;
      padding: 24px;
      border-radius: 12px;
    }

    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      margin: 6px;
      text-align: center;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 6px;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    #message {
      margin: 16px 0;
      min-height: 24px;
      color: #facc15;
    }

    .board {
      margin-top: 20px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .cell {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      border-radius: 6px;
      background: #374151;
    }

    .green {
      background: #16a34a;
    }

    .yellow {
      background: #ca8a04;
    }

    .gray {
      background: #4b5563;
    }

    .info {
      margin-top: 16px;
      color: #d1d5db;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>WORD BATTLE</h1>
    <p>5文字の英単語を当てる対戦ゲーム</p>

    <div>
      <button id="createRoomButton">部屋を作る</button>
    </div>

    <div>
      <input id="roomInput" placeholder="部屋ID" maxlength="4" />
      <button id="joinRoomButton">部屋に入る</button>
    </div>

    <hr />

    <div>
      <input id="guessInput" placeholder="5文字の単語" maxlength="5" disabled />
      <button id="guessButton" disabled>送信</button>
    </div>

    <div id="message">部屋を作るか、部屋IDを入力してください。</div>

    <div class="info">
      <div>現在の部屋ID：<span id="roomDisplay">なし</span></div>
      <div>相手の入力回数：<span id="opponentCount">0</span></div>
    </div>

    <div id="board" class="board"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let currentRoomId = null;
    let gameStarted = false;

    const createRoomButton = document.getElementById("createRoomButton");
    const joinRoomButton = document.getElementById("joinRoomButton");
    const roomInput = document.getElementById("roomInput");
    const guessInput = document.getElementById("guessInput");
    const guessButton = document.getElementById("guessButton");
    const message = document.getElementById("message");
    const roomDisplay = document.getElementById("roomDisplay");
    const opponentCount = document.getElementById("opponentCount");
    const board = document.getElementById("board");

    createRoomButton.addEventListener("click", () => {
      socket.emit("createRoom");
    });

    joinRoomButton.addEventListener("click", () => {
      const roomId = roomInput.value.trim();

      if (roomId.length !== 4) {
        message.textContent = "4文字の部屋IDを入力してください。";
        return;
      }

      socket.emit("joinRoom", {
        roomId
      });
    });

    guessButton.addEventListener("click", submitGuess);

    guessInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        submitGuess();
      }
    });

    function submitGuess() {
      if (!gameStarted) {
        message.textContent = "まだゲームは始まっていません。";
        return;
      }

      const guess = guessInput.value.trim().toUpperCase();

      if (guess.length !== 5) {
        message.textContent = "5文字で入力してください。";
        return;
      }

      socket.emit("submitGuess", {
        roomId: currentRoomId,
        guess
      });

      guessInput.value = "";
    }

    function addGuessRow(guess, result) {
      const row = document.createElement("div");
      row.className = "row";

      for (let i = 0; i < guess.length; i++) {
        const cell = document.createElement("div");
        cell.className = `cell ${result[i]}`;
        cell.textContent = guess[i];
        row.appendChild(cell);
      }

      board.appendChild(row);
    }

    socket.on("roomCreated", ({ roomId }) => {
      currentRoomId = roomId;
      roomDisplay.textContent = roomId;
      message.textContent = `部屋を作りました。相手に部屋ID「${roomId}」を教えてください。`;
    });

    socket.on("gameStart", ({ roomId, message: startMessage }) => {
      currentRoomId = roomId;
      gameStarted = true;

      roomDisplay.textContent = roomId;
      message.textContent = startMessage;

      guessInput.disabled = false;
      guessButton.disabled = false;
      guessInput.focus();
    });

    socket.on("guessResult", ({ guess, result }) => {
      addGuessRow(guess, result);
      message.textContent = "判定しました。";
    });

    socket.on("opponentProgress", ({ guessCount }) => {
      opponentCount.textContent = guessCount;
    });

    socket.on("gameOver", ({ winner, answer }) => {
      gameStarted = false;

      guessInput.disabled = true;
      guessButton.disabled = true;

      if (winner === socket.id) {
        message.textContent = `あなたの勝ちです！答えは ${answer} でした。`;
      } else {
        message.textContent = `相手の勝ちです。答えは ${answer} でした。`;
      }
    });

    socket.on("errorMessage", (text) => {
      message.textContent = text;
    });
  </script>
</body>
</html>
